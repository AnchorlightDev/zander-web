# Zander Addon Configuration

# --- Plugin Settings ---
# The base URL of the live zander-web API. Policy links, social links, rewards and
# bridge tasks are all fetched from here.
api-url: "https://craftingforchrist.net"

# API key for authenticated endpoints (x-access-token header)
api-key: "changeme"

# The name of this server (sent to the command bridge when claiming rewards)
server-name: "survival"

# --- Command Bridge ---
# Claims and executes pending reward commands for players on join
command-bridge:
  enabled: true

# --- Bridge Processor ---
# Polls for queued server-side console tasks on a timer
bridge:
  enabled: true

# --- Policy Book ---
policy-book:
  enabled: false
  slot: 8

# --- Social Media Paper ---
social-paper:
  enabled: false
  slot: 7
